name: CI

# Valida lint, tipos e build a cada push/PR — barreira de qualidade antes do deploy da Vercel.
on:
  push:
    branches: [main]
  pull_request:

# Cancela execuções antigas da mesma ref quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint + segurança)
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
